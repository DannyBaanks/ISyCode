name: ISyCode IDE Release

on:
  push:
    tags:
      - "ide-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. ide-v0.4.0)"
        required: true
        default: "ide-v0.4.0"
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage (x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ide
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt & AppImage system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 file desktop-file-utils curl

      - name: Install ISyCode IDE + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]"

      - name: Download appimagetool
        run: |
          curl -fsSL -o /tmp/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool-x86_64.AppImage

      - name: Build Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          out_dir=$(python packaging/build_ide.py --appimagetool /tmp/appimagetool-x86_64.AppImage | tail -n 1)
          mkdir -p ../release-assets
          cp "$out_dir/ISyCode-IDE-x86_64.AppImage" ../release-assets/ISyCode-IDE-linux-x86_64.AppImage
          chmod +x ../release-assets/ISyCode-IDE-linux-x86_64.AppImage
          ls -lh ../release-assets/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: isycode-ide-linux
          path: release-assets/ISyCode-IDE-linux-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows Executable (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ide
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ISyCode IDE + PyInstaller + Pillow
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]" pillow

      - name: Generate Windows ICO icon
        run: |
          python -c "from PIL import Image; img = Image.open('ui/assets/isycode_256x256.png'); img.save('build_icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build Windows single-file .exe
        env:
          ISYCODE_ONEFILE: "1"
          ISYCODE_BIN_NAME: "ISyCode-IDE-windows-x86_64"
          ISYCODE_ICON_PATH: "${{ github.workspace }}\\ide\\build_icon.ico"
        run: |
          python -m PyInstaller --noconfirm --clean --distpath ../release-assets packaging/isycode_ide.spec
          Get-ChildItem ../release-assets

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: isycode-ide-windows
          path: release-assets/ISyCode-IDE-windows-x86_64.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS Disk Image (arm64)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ide
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ISyCode IDE + PyInstaller + Pillow
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]" pillow

      - name: Generate macOS ICNS icon
        run: |
          python -c "from PIL import Image; Image.open('ui/assets/isycode_512x512.png').save('build_icon.icns')"

      - name: Build macOS .app bundle and .dmg
        env:
          ISYCODE_BIN_NAME: "isycode-ide"
          ISYCODE_ICON_PATH: "${{ github.workspace }}/ide/build_icon.icns"
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist-macos packaging/isycode_ide.spec
          mkdir -p ../release-assets dmg-stage
          cp -R "dist-macos/ISyCode IDE.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "ISyCode IDE" -srcfolder dmg-stage -ov -format UDZO \
            ../release-assets/ISyCode-IDE-macos-arm64.dmg
          ls -lh ../release-assets/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: isycode-ide-macos
          path: release-assets/ISyCode-IDE-macos-arm64.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bundle
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: release-bundle
        run: |
          sha256sum ISyCode-IDE-windows-x86_64.exe ISyCode-IDE-linux-x86_64.AppImage ISyCode-IDE-macos-arm64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          IS_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## ISyCode IDE — Binarios de escritorio

          Compilados automáticamente por GitHub Actions para las tres plataformas:

          | Plataforma | Archivo | Notas |
          | --- | --- | --- |
          | **Windows (x86_64)** | `ISyCode-IDE-windows-x86_64.exe` | Ejecutable portátil sin instalador |
          | **Linux (x86_64)** | `ISyCode-IDE-linux-x86_64.AppImage` | `chmod +x` y ejecutar |
          | **macOS (Apple Silicon)** | `ISyCode-IDE-macos-arm64.dmg` | Arrastrar `ISyCode IDE.app` a Aplicaciones |

          Incluye `SHA256SUMS.txt` para verificar integridad de cada binario.
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              release-bundle/ISyCode-IDE-windows-x86_64.exe \
              release-bundle/ISyCode-IDE-linux-x86_64.AppImage \
              release-bundle/ISyCode-IDE-macos-arm64.dmg \
              release-bundle/SHA256SUMS.txt \
              --clobber
          else
            EXTRA_ARGS=""
            if [ "$IS_PRERELEASE" = "true" ]; then
              EXTRA_ARGS="--prerelease"
            fi
            gh release create "$TAG_NAME" \
              release-bundle/ISyCode-IDE-windows-x86_64.exe \
              release-bundle/ISyCode-IDE-linux-x86_64.AppImage \
              release-bundle/ISyCode-IDE-macos-arm64.dmg \
              release-bundle/SHA256SUMS.txt \
              --title "ISyCode IDE $TAG_NAME" \
              --notes-file /tmp/release-notes.md \
              $EXTRA_ARGS
          fi
