name: ISyCode IDE CI

on:
  push:
    branches: [main, "ide/**"]
    paths:
      - "ide/**"
      - ".github/workflows/ide-ci.yml"
  pull_request:
    paths:
      - "ide/**"
      - ".github/workflows/ide-ci.yml"

jobs:
  ide-smoke-and-tests:
    name: IDE build, pytest & offscreen smoke (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ide
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt headless system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install ISyCode IDE (editable + dev + ui)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: Run IDE test suite (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Smoke test IDE startup & PLAN glob boundary
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -P - <<'PY'
          import asyncio, tempfile
          from pathlib import Path
          from core.runtime.base import SandboxRuntime, ToolCall
          with tempfile.TemporaryDirectory() as d:
              root = Path(d)
              (root / "demo.py").write_text("print('ok')\n")
              rt = SandboxRuntime(root)
              ok = asyncio.run(rt.execute(ToolCall("glob", {"pattern": "*.py"}, "s1")))
              assert ok.success and "demo.py" in ok.stdout
              bad = asyncio.run(rt.execute(ToolCall("glob", {"pattern": "../etc/*"}, "s2")))
              assert not bad.success and bad.error_code == "PATH_OUTSIDE_WORKSPACE"
          print("IDE smoke PASS")
          PY
