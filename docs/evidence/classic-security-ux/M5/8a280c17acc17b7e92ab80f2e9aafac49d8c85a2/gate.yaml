    esperado: push/publicación/envío sin autorización no sale; cambiar payload/destino invalida aprobación; rechazar no genera efecto externo
    observado: >
      Pasó. Sin grant ni approval no hay transporte; con approval pero sin
      grant sigue DENY; sin transporte configurado la razón es "no publication
